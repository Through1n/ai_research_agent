# 学术风主题：克制的蓝灰配色，适合评审观感
[theme]
primaryColor = "#1f5fae"
backgroundColor = "#f7f9fc"
secondaryBackgroundColor = "#eef4fb"
textColor = "#1d2733"
font = "sans-serif"

# 桌面壳（pywebview）内嵌时的服务器行为；纯浏览器开发同样可用
[server]
# 静态资源服务：把 ./static 映射到 /app/static/<file>，mermaid.min.js 随软件本地分发（零插件可用）
enableStaticServing = true
headless = true
address = "127.0.0.1"
baseUrlPath = ""
enableCORS = false
enableXsrfProtection = false
runOnSave = false

[browser]
gatherUsageStats = false
# openInExternalBrowser 已在 streamlit 1.63 移除，保留会刷 WARNING；headless=true 本就不开浏览器

[client]
showErrorDetails = true
toolbarMode = "minimal"
