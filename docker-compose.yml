# ============================================================================
#  AI4S 科研助手 Agent —— 一键部署
#  用法：docker compose up -d   （全新克隆即可，不需要先建 .env）
#        想配 Key：cp .env.example .env 后按需填写；也可以直接在宿主环境 export 同名变量。
#        不配 Key 也能起：应用内置演示语料，侧边栏「🚀 一键加载演示数据」可离线体验
#
#  注：本文件已按 Compose v2（docker compose，非旧版 docker-compose）编写
# ============================================================================

services:
  ai4s-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai4s_research_agent
    # Dockerfile 已 USER app(uid 10001)；容器内不再需要 root
    ports:
      # 只绑回环：应用本身没有任何鉴权，8501 对公网开放等于让别人用你的 Key 调模型。
      # Nginx 与容器同机，走 127.0.0.1:8501 即可反代（Nginx 对外监听 80 或 443），不需要暴露 8501。
      #
      # 【这一行什么时候才需要动】默认不动。team-lead 最终裁决是"四档决策门"，见 DEPLOY.md：
      #   ① 有域名           → 保持本行，Nginx 对外 443 HTTPS（certbot）      ✅ 推荐
      #   ② 无域名 · 境外机房 → 保持本行，Nginx 对外 :80 HTTP（不需要域名）     ✅ 可行
      #   ③ 无域名 · 大陆未备案 → **建议别选方案 C，改走方案 A（Streamlit Cloud）**
      #                          （境内机房 80/443 大概率被云厂商封禁，绑回环 + 无入口 = 评委访问不到）
      #   ④ 坚持裸奔直连      → 才把本行改成 "8501:8501"，且**必须**在安全组限制来源 IP
      # 也就是说：绑回环**不等于必须有域名**（第 ② 档就不需要），别因为"我没域名"就去改这一行 ——
      # 真正该做的是先看第 ③ 档：大陆未备案场景下方案 C 本身就該换掉。
      # （端口冲突时改中间那段，如 "127.0.0.1:8502:8501"）
      - "127.0.0.1:8501:8501"

    # ---------- 环境变量注入 ----------
    # 【为什么 env_file 不用旧写法】`env_file: - .env` 在 .env 缺失时 compose 直接 abort
    # （"env file not found"）。.env 被 .gitignore 排除、不在仓库里，全新克隆必然踩中。
    # `required: false` → 有 .env 就加载，没有也不报错。
    env_file:
      - path: .env
        required: false
    # 【为什么还要 environment】${VAR:-默认} 语法让变量既能从宿主环境取值，
    # 也能从项目根目录的 .env 取值（compose 用 .env 做变量插值），且**永不因文件缺失而失败**。
    # ⚠️ environment 优先级高于 env_file：下面列出的变量以这里为准。
    #    密钥变量的默认值一律留空（`${XXX:-}`），空串 = 交给代码自己的回退链，
    #    且 config.py 的 _env_str() 把空串视为"未设置"（先回落 st.secrets，再回落默认值），不会顶掉兜底逻辑。
    environment:
      # ---- 密钥类：默认值留空，绝不在这里写真值 ----
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_TOKEN: ${GITHUB_API_TOKEN:-}
      # ---- 策略类：给真实默认值 ----
      # services/state.py:81 —— _env_str("LLM_PROVIDER", "zhipu")，默认值与这里保持一致
      LLM_PROVIDER: ${LLM_PROVIDER:-zhipu}
      # HF_ENDPOINT 默认留空：本服务显式 AI4S_DESKTOP=0（云平台态），按 config.py:131
      # 的设计「仅桌面态（国内）启镜像；云平台留空走 huggingface.co（境外连镜像更慢/
      # 易超时）」。曾默认注入 hf-mirror 与已修正的 Dockerfile ENV 属同类缺陷——compose
      # 的 environment 会绕过 config.py 的 setdefault 桌面态守卫。且该镜像对 chroma 的
      # ONNX 模型无效（那个走 chroma 自己的 AWS S3）。确需镜像的用户显式设
      # HF_ENDPOINT=https://hf-mirror.com 即可（环境变量/.env 优先，能力不删）。
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      # config.py 的 DESKTOP_MODE —— AI4S_DESKTOP 必须为 0/空！设为 1 会进入桌面模式，
      # 数据目录跑到 %APPDATA%/AI4SResearchAgent，容器里路径全错
      AI4S_DESKTOP: "0"
      TZ: ${TZ:-Asia/Shanghai}
      # ---- 调优类：空串 = 让代码用内置默认值（config.py 的 _env_str / _env_int / _env_float）----
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VL_MODEL: ${VL_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-}
      LLM_PROVIDERS_EXTRA: ${LLM_PROVIDERS_EXTRA:-}
      CHUNK_SIZE: ${CHUNK_SIZE:-}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-}
      DENSE_K: ${DENSE_K:-}
      SPARSE_K: ${SPARSE_K:-}
      FINAL_K: ${FINAL_K:-}
      DEDUP_THRESHOLD: ${DEDUP_THRESHOLD:-}
      AGENT_MAX_ITERS: ${AGENT_MAX_ITERS:-}
      AGENT_GLOBAL_MAX_ITERS: ${AGENT_GLOBAL_MAX_ITERS:-}
      # ⚠️ 下面两个是第八轮用 AST 全仓扫描补进来的——**此前漏了**（deploy-doc 用同一方法
      #    在他的文档里查出 MAX_UPLOAD_MB 缺失，我照做后发现自己 compose 也漏了这两个）。
      #    教训：我原来那份清单是 grep 出来的，grep 只能证明"出现过"，证明不了"列全了"。
      LLM_RETRY_BUDGET_SEC: ${LLM_RETRY_BUDGET_SEC:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      #   ↑ MAX_UPLOAD_MB 默认 100（config.py 的 _env_int），是**应用层硬上限**：
      #     ui/page_library.py 在解析前判断 `_mb > MAX_UPLOAD_MB` 并 st.stop()。
      #     ⚠️ 若在此调高它，必须同时调大 Dockerfile CMD 的 --server.maxUploadSize，
      #        否则 streamlit 会先把文件拦掉（详见 Dockerfile 该处注释）。

    # ---------- 数据持久化 ----------
    # 【为什么默认用命名卷而不是 bind mount（Round 13 结论）
    #  ⚠️ 其中「属主随 copy-up 复制」一条**未实测**（本机无 docker），见本段末尾】
    #   storage/ 被 .gitignore（第 14 行）与 .dockerignore（第 25 行）双重排除
    #   → 全新克隆的宿主机上**不存在**这个目录。
    #   · 若写成 bind mount（`- ./storage:/app/storage`）：compose 会在宿主机新建一个
    #     **root:root 755** 的空目录挂进容器，而容器内进程是 uid 10001（Dockerfile USER app）。
    #     结果是 config.py:42 的 `_d.mkdir(parents=True, exist_ok=True)` 在建
    #     storage/uploads 时抛 PermissionError → 发生在 import 期 → 被 app.py:34 的兜底捕获
    #     后显示成「依赖未安装或版本不匹配」（真因是权限，文案会误导排查方向）。
    #     这正是本轮要消灭的「评委打开时是空的会崩」——不是空的崩，是没权限崩。
    #   · 命名卷：新建卷挂载时 Docker 会把镜像内该目录的内容**连同属主**复制进卷
    #     （官方 volumes 文档的 copy-up 语义；postgres 官方镜像的 PGDATA 同样依赖它），
    #     而 Dockerfile 第 4 层已把 /app/storage 及子目录预置并 chown 给 app:app。
    #   ⚠️ 该 copy-up 是否保留属主**本机无 docker，未实测**。首次 up 后请按
    #      docs/部署后自检清单.md §1.1 跑一次 `ls -ld` 校验，属主必须是 app。
    #
    # 【要改回 bind mount（想在宿主机直接看 library.json）时必做的三步】
    #   1) 先把卷里的数据拷出来：docker compose cp ai4s-agent:/app/storage ./storage_backup
    #   2) 把下面那行改成 `- ./storage:/app/storage`，并在宿主机执行：
    #        mkdir -p storage && sudo chown -R 10001:10001 storage
    #   3) docker compose up -d（旧命名卷随之闲置，确认无用后 `docker volume rm` 清理）
    volumes:
      # 业务数据主目录：library.json（services/state.py:90/95）
      #   + memory.json / user_profile.json（core/memory.py:18/23/26）
      #   + storage/uploads（上传 PDF 落盘，services/library.py:777；插图子目录 parsing.py:690）
      #   + storage/chroma（向量库，services/state.py:68）
      #   + storage/cache（引用数磁盘缓存，citation_quality.py:66/152）
      #   + storage/llm_failures.log / llm_config_errors.log（core/llm.py:381-384）
      - app_storage:/app/storage
      # ⚠️ 这里**故意不挂** $HOME/.cache/chroma：ONNX embedding 模型已在 Dockerfile 第 5 层
      #    构建期预热并烤进镜像（/home/app/.cache/chroma/onnx_models/all-MiniLM-L6-v2）。
      #    体积口径（实测，三个量别混着说）：
      #      · 下载/压缩包 onnx.tar.gz   83,178,821 B = 79.31 MiB
      #      · 解压后 onnx/ 目录         91,332,068 B = 87.10 MiB（其中 model.onnx 单文件 90,387,606 B = 86.20 MiB）
      #      · 缓存目录合计（含压缩包） 174,510,889 B = 166.42 MiB ← 镜像承担的是这个
      #    （早期流传的"90MB / 167MB"是估值，且曾把压缩包算进解压量，现以上面三行为准。）
      #
      #    为什么不挂卷（Docker 命名卷语义，按官方文档取证、未实测）：
      #      · 挂载**空的新命名卷**时，镜像内该目录的内容会被复制进卷 → 那时模型能存活
      #      · 但卷**已存在且非空**时不再复制，卷内容**遮盖**镜像目录 → 用旧镜像跑过一次后，
      #        重建镜像不会刷新卷里的内容，模型版本变了就会读到旧的
      #      · 若你把它写成 **bind mount**（- ./xxx:/home/app/.cache/chroma），那才是必然为空、
      #        必然遮盖，预热一定白做 —— 千万别这么写
      #    （措辞订正：我此前简写成"挂卷会覆盖掉它"，对空卷不成立，准确说法见上。
      #      由 deploy-audit 查 Docker 官方存储文档纠正，我确认采纳。）
      #    不挂卷的真正理由：模型已烤进镜像，挂卷**零收益**，只多两个风险
      #      （① 镜像重建后卷内容陈旧；② 后人改成 bind mount 直接失效）。
      #    代价只是镜像大 166.42 MiB，可接受。
      #    将来若真要刷新卷里的模型，正确姿势是 docker compose down -v（连卷删）再 up，
      #    而不是"进容器删缓存让它重下"。
      # 应用异常日志：app.py:15 LOG_DIR="logs"、ui/common.py:191-192（相对 CWD /app）
      # ⚠️ 与 config.py:36 的 LOGS_DIR 不是一回事：非桌面态 LOGS_DIR = ROOT/"storage"，
      #    但全仓 grep 下来**没有任何运行时代码读它**（只有 config.py 自己定义与 mkdir），
      #    真正落盘的是上面这两个硬编码的 "logs"。所以这里挂 /app/logs 是对的。
      # 用命名卷而非 bind，理由与 app_storage 相同（避免宿主机目录属主不匹配）。
      # 镜像内 /app/logs 已由 Dockerfile 第 4 层预置一个 .keep 空文件并 chown app:app，
      # 使命名卷 copy-up 时有内容可依；即便最坏情况回落到 root 属主，
      # 后果也只是「异常日志丢失」（app.py:28 / ui/common.py:228 都静默吞掉写失败），
      # 应用本身照常可用 —— 与 /app/storage 的致命性不同。
      # 首次 up 后顺手校验：docker compose exec ai4s-agent ls -ld /app/logs（应为 app）
      - app_logs:/app/logs

    # ---------- 健康检查（与 Dockerfile HEALTHCHECK 一致的参数，便于 docker compose ps 观察）----------
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要初始化 chroma 持久化库 + 载入已烤进镜像的 ONNX 模型，给足宽限期
      start_period: 120s

    restart: unless-stopped

    # ---------- 日志轮转（防止 errors.log / 容器 stdout 无限增长）----------
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ---------- 资源上限（可选；不需要就整段删掉）----------
    # 说明：是"上限"不是"预留"，宿主内存/核心数少于此值也能正常启动
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

volumes:
  # 业务数据（文献库 / 向量库 / 记忆 / 上传件 / 失败日志）
  # 镜像内 /app/storage 已预置种子文件与子目录并 chown app:app（Dockerfile 第 4 层），
  # 新建卷挂载时由 Docker copy-up 复制进去，容器首次启动即可写。
  app_storage:
  # 应用异常日志（logs/errors.log）
  app_logs:
