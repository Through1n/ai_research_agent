      <stop offset="0" stop-color="rgb(47, 124, 201)" />
      <stop offset="1" stop-color="rgb(23, 78, 142)" />
    </linearGradient>
    <clipPath id="mh-squircle">
      <rect x="0" y="0" width="1" height="1" rx="0.219" ry="0.219" />
